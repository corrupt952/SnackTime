name: Release

concurrency:
  group: "release"
  cancel-in-progress: true

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: "pnpm"
      - name: Export current version
        run: echo "SNACK_TIME_VERSION=v$(jq -r .version package.json)" > $GITHUB_ENV
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: >-
          cd .output/chrome-mv3 && \
            zip -r ../../snack_time.zip ./*
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${{ env.SNACK_TIME_VERSION }}"
          snack_time.zip#"snack-time-${{ env.SNACK_TIME_VERSION }}.zip"
          --generate-notes
          --title "Release ${{ env.SNACK_TIME_VERSION }}"
